<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and CLass Selectors</title>
    <style>
        #first_heading{
            color: hotpink;
        }
        #random_text{
            color: aqua;
        }
        .second_heading{
            color: lavender;
        }
    </style>
</head>
<body>
    <h1 id="first_heading">This is the heading</h1>
    <p id="random_text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae, voluptas!</p>
    <p class="second_heading">Class is used to group more than one type of tags</p>
    <div class="second_heading">Div of second heading</div>
</body>
</html>
