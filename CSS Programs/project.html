<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progess Bar</title>

    <style>

        #container{
            height: 25px;
            width: 90%;
            background-color:darkgrey;
            border-radius: 20px;
            border: 3px solid;
            position: relative;
        }

        #bar{
            height: 100%;
            background-color: crimson;
            border-radius: 20px;

            animation: progress 3s 5;
        }

        @keyframes progress{
            0%{width: 0%;}
            95%{width: 95%;}
            97%{width: 90%;}
            100%{width: 100%;}
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="bar"></div>
    </div>
</body>
</html>
