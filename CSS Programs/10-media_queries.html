<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        #box{
            padding: 10px;
            height: 100px;
            width: 100px;
            background-color: chocolate;
        }
        @media screen and (min-width: 200px) and (max-width: 400px) {
            #box{
                background-color: aqua;
                border-radius: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="box">Box</div>
</body>
</html>
