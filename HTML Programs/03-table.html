<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>

    <table border="1"> 
        <caption>Student information</caption>
        <tr>
            <th>Name</th> <!--Table Headers-->
            <th>Age</th>
            <th>Language</th>
        </tr>

        <tr><!--Table row-->
            <td><!--Table data-->
                Rahul
            </td>
            <td>20yrs</td>
            <td>C++</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>21yrs</td>
            <td>Python</td>
        </tr>
        <tr>
            <td colspan="3"> Takes multiple column</td>
        </tr>

    </table>
    
</body>
</html>
