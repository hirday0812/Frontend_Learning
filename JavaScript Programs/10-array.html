<!DOCTYPE html>
<html lang="en">
<head>
  <title>Array</title>
</head>
<body>
  <script>


    let arr = [1,2,3];
    console.log(arr);
    arr.push(6);
    console.log(arr);
    console.log('popped ' + arr.pop());
    console.log(arr);
    console.log('popped ' + arr.pop());
    console.log(arr);


    let arr2 = [3,5,7,6];
    console.log(arr2);
    arr2.splice(1, 3);
    console.log(arr2);
    
    let arr3 = [9,8,5,7,6];
    console.log(arr3);
    arr3.sort();
    console.log(arr3);

    let [a,b,c,d] = arr3;
    console.log(a + " " + b + " " + c + ' ' + d);


    let number = [3,1,4,5,7,8];
    for(let i = 0 ; i < number.length ; i++){
      console.log(number[i]);
    }

    // Or we can write the same as using:
    number.forEach(num => console.log(num));


  </script>
</body>
</html>
