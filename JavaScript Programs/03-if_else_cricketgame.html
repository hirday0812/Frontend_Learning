<!DOCTYPE html>

<head>
  <title>Cricket Game if else</title>
  <style>
    body{
      text-align: center;
    }
  </style>

<body>
  <h1>Bat Ball Stump Game</h1>

  <!-- Made a basic rock paper scissor (cricket) game using basics of javascript -->

  <button onclick="
  let computerChoice;
  let randomNumber = Math.random() * 3; //Generates a random number between 0 and 3
  
  if(randomNumber > 0 && randomNumber <= 1){
    computerChoice = `Bat`;
  }
  else if(randomNumber > 1 && randomNumber <= 2){
    computerChoice = `Ball`;
  }
  else{
    computerChoice = `Stump`;
  }
  
  let resultMsg
  if(computerChoice === `Bat`){
    resultMsg = `It's a tie`;
  }
  else if(computerChoice === `Ball`){
    resultMsg = `User won`;
  }
  else{
    resultMsg = `Computer Won`;
  }
  
  alert(`You have chosen Bat , The computer chooses ${computerChoice} and ${resultMsg}`);
  
  ">Bat</button>
